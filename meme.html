<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA 6's Third Protagonist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 1024px; overflow: hidden; background: #1b0b2e;
    font-family: "Arial Black", "Liberation Sans", "DejaVu Sans", sans-serif; }
  .scene { position: relative; width: 1024px; height: 1024px; overflow: hidden;
    background: linear-gradient(180deg, #2b1055 0%, #7597de 0%, #ff2e88 42%, #ff7a18 68%, #ffd319 100%); }
  /* synthwave sun */
  .sun { position: absolute; left: 312px; top: 150px; width: 400px; height: 400px; border-radius: 50%;
    background: linear-gradient(180deg, #fff7ae 0%, #ffd319 45%, #ff7a18 100%); }
  .sun .slat { position: absolute; left: 0; width: 400px; background: #ff2e88; opacity: 0.85; }
  .sun .s1 { top: 250px; height: 10px; }
  .sun .s2 { top: 285px; height: 14px; }
  .sun .s3 { top: 325px; height: 18px; }
  .sun .s4 { top: 370px; height: 22px; }
  /* skyline silhouette */
  .skyline { position: absolute; left: 0; bottom: 0; width: 1024px; height: 300px; }
  /* palm silhouettes */
  .palm { position: absolute; bottom: 0; }
  .palm.left { left: 8px; }
  .palm.right { right: 8px; transform: scaleX(-1); }
  h1 { position: absolute; top: 34px; left: 0; width: 1024px; text-align: center;
    font-size: 74px; line-height: 1.05; font-weight: 900; color: #fff; letter-spacing: 1px;
    text-shadow: 5px 5px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000,
      0 6px 0 #000, 0 -3px 0 #000, 5px 0 0 #000, -5px 0 0 #000; }
  h1 .pink { color: #ffd319; }
  .cards { position: absolute; top: 318px; left: 0; width: 1024px; display: flex;
    justify-content: center; gap: 22px; }
  .card { width: 288px; padding: 16px 12px 14px; text-align: center;
    background: rgba(20, 4, 40, 0.55); border: 4px solid #fff; border-radius: 20px; }
  .card.ghost-card { border-color: #ffd319; background: rgba(60, 0, 40, 0.62); }
  .card .name { margin-top: 8px; font-size: 40px; font-weight: 900; color: #fff; letter-spacing: 1px;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
  .card .job { margin-top: 2px; font-size: 27px; font-weight: 900; color: #ffd319; letter-spacing: 2px;
    text-shadow: 2px 2px 0 #000; }
  .card.ghost-card .job { color: #ff7ad9; }
  .bottom { position: absolute; bottom: 34px; left: 0; width: 1024px; text-align: center; }
  .bottom .line { font-size: 56px; font-weight: 900; color: #fff; line-height: 1.12;
    text-shadow: 4px 4px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000,
      0 5px 0 #000, 4px 0 0 #000, -4px 0 0 #000; }
  .bottom .brand { margin-top: 10px; font-size: 46px; font-weight: 900; color: #ff2e88;
    background: #fff; display: inline-block; padding: 2px 26px; border-radius: 40px;
    border: 4px solid #000; }
</style>
</head>
